[platformio]
core_dir = .pio-core

[env:stackchan]
platform = espressif32@6.12.0
board = m5stack-cores3
framework = arduino
platform_packages =
    platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
lib_deps =
    m5stack/M5GFX@0.2.31
    m5stack/M5Unified@0.2.25
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
  -Wl,--wrap=SCCB_Init
  -Wl,--wrap=SCCB_Use_Port
  -Wl,--wrap=SCCB_Deinit
  -Wl,--wrap=SCCB_Probe
  -Wl,--wrap=SCCB_Read
  -Wl,--wrap=SCCB_Write
  -Wl,--wrap=SCCB_Read16
  -Wl,--wrap=SCCB_Write16
  -Wl,--wrap=SCCB_Read_Addr16_Val16
  -Wl,--wrap=SCCB_Write_Addr16_Val16
monitor_speed = 115200
